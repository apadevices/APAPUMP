sentence=Filtration pump controller for APA Devices pool automation — relay control, pressure monitoring, filter maintenance tracking
paragraph=Non-blocking Arduino library for autonomous control of a pool filtration pump. Manages relay on/off, pump run scheduling, pressure-based alarms (low pressure = dry run protection, high pressure = dirty filter alert), and filter maintenance tracking. Designed to integrate with APADOSE (chemical dosing) and APALCDGUI (HMI display) as part of the APA Pool Automation system.
