name=APAPUMP
version=1.3.0
author=APADevices <kecup@vazac.eu>
maintainer=APADevices <kecup@vazac.eu>
sentence=Filtration pump controller for APA Devices pool automation — relay control, pressure and current protection, filter status, solar heating and heat pump
paragraph=Non-blocking Arduino library for autonomous control of a pool filtration pump. Manages relay on/off, pump run scheduling, pressure-based alarms (dry run, overpressure), overcurrent protection with a self-learned baseline, filter status (backwash reminder from the pressure rise above the self-learned clean-filter pressure), solar heating on top of the schedule (valve, overheat protection, sensor validation) and a heat pump on the AUX relay (solar first, short-cycling guard). Settings are saved in EEPROM. Designed to integrate with APADOSE (chemical dosing) and APALCDGUI (HMI display) as part of the APA Pool Automation system.
category=Device Control
url=https://github.com/apadevices/APAPUMP
architectures=*
includes=APAPUMP.h
depends=Wire
